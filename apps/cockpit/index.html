<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1020" />
    <!--
      The browser tab icon. Without this the Cockpit tab showed the browser's generic grey globe:
      the page declared no icon, so the browser fell back to asking for /favicon.ico at the site
      root, and CockpitReactApp answered 404 because no such file existed under wwwroot/c.
      public/favicon.ico is the Director's own application icon, written from the same drawing by
      scripts/branding/generate_director_icon.py, so the tab carries the same mark as the Director
      on the machine. Vite copies public/ verbatim into the build output, which the Gateway's
      BuildCockpitApp target stages into wwwroot/c - and /favicon.ico is already in the public path
      set in AuthMiddleware, so the mark also shows on the sign-in screen, before anyone has signed
      in. The icon is declared here rather than left to the site-root convention because the Cockpit
      is a single-page application served under deep paths such as /session/{id}, and a declared
      icon is resolved against the document rather than the path the reader happens to be on.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>DevThrottle Cockpit</title>
    <!--
      Epic #967: this is the React Cockpit, served same-origin by the Gateway at the site root "/"
      (issue #979 retired the Blazor Server Cockpit). It carries NO credential in the page - the
      browser talks only to the Gateway through root-relative paths, and the WebSocket token rides as
      the cc-gateway-token cookie.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
