name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# A newer pull-request push makes the older run stale. Main-branch runs use a unique run identifier,
# so they are never cancelled. Release builds live in release.yml and are unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Decide which builds are needed
    runs-on: ubuntu-latest
    outputs:
      run_dotnet: ${{ steps.classify.outputs.run_dotnet }}
      run_web: ${{ steps.classify.outputs.run_web }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $allZeroes = "0000000000000000000000000000000000000000"
          if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or
              [string]::IsNullOrWhiteSpace($env:HEAD_SHA) -or
              $env:BASE_SHA -eq $allZeroes) {
            $paths = @()
          } else {
            $paths = @(git diff --name-only --diff-filter=ACDMRT $env:BASE_SHA $env:HEAD_SHA)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not determine changed paths."
            }
          }

          $classification = ./scripts/ci/classify-changes.ps1 -Path $paths | ConvertFrom-Json
          $runDotNet = $classification.run_dotnet.ToString().ToLowerInvariant()
          $runWeb = $classification.run_web.ToString().ToLowerInvariant()
          "run_dotnet=$runDotNet" >> $env:GITHUB_OUTPUT
          "run_web=$runWeb" >> $env:GITHUB_OUTPUT
          "reason=$($classification.reason)" >> $env:GITHUB_OUTPUT

          "### Build decision" >> $env:GITHUB_STEP_SUMMARY
          "Changed paths: $($classification.path_count)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Build | Required |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Microsoft .NET | $runDotNet |" >> $env:GITHUB_STEP_SUMMARY
          "| Web | $runWeb |" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Reason: $($classification.reason)" >> $env:GITHUB_STEP_SUMMARY

  build-and-test:
    name: Build & Test (.NET)
    needs: changes
    if: needs.changes.outputs.run_dotnet == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore cc-director.sln

      - name: Build solution
        run: dotnet build cc-director.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test cc-director.sln -c Release --no-build --verbosity normal

      # The installer's own tests. They are NOT in cc-director.sln, so the step above
      # never touched them: roughly 415 tests - the gateway-surface guard, the wizard step flow,
      # the uninstaller tests, the completion classification - ran only when someone happened to
      # invoke them by hand. So a change could have re-broken the first thing a new user ever sees
      # and CI would have stayed green. Found while adding the Git prerequisite row (#2242), by
      # running them manually rather than trusting the green tick. Same shape as the JavaScript
      # gap below.
      #
      # The prerequisite and capability-notice tests this comment used to name are gone with the
      # Prerequisites step itself: the Windows executables carry their own .NET runtime now, so the
      # installer needs nothing already on the machine and has nothing to check.
      #
      # Built here rather than in the solution build: these are net10.0-windows projects
      # outside the solution, so they restore and build themselves.
      - name: Run installer tests
        run: |
          dotnet test tools/cc-director-setup.Tests/ -c Release --verbosity normal
          dotnet test tools/cc-director-setup-engine.Tests/ -c Release --verbosity normal

  # The browser shells (the mobile PWA and the React Cockpit) and the client-core library they share.
  #
  # This job exists because CI ran NO JavaScript tests at all: 583 vitest tests across client-core and
  # the Cockpit were green only when someone happened to run them by hand, so nothing stopped a pull
  # request from landing a broken shell. The mobile voice-mode fix in #1631 is guarded by tests in
  # client-core that CI would not have run - which is what prompted this.
  #
  # Ubuntu on purpose: the .NET job needs Windows because the product is a Windows app, but these are
  # platform-independent unit tests and a Vite build, and Ubuntu runners are quicker and cheaper.
  web:
    name: Build & Test (web)
    needs: changes
    if: needs.changes.outputs.run_web == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit across every workspace. The shells are typechecked on every build locally
      # (#1578/#1579); this is the same gate, enforced on the pull request.
      - name: Typecheck the workspaces
        run: npm run typecheck

      # Named one workspace per line, deliberately NOT `npm test --workspaces --if-present`: that form
      # passes silently for a workspace with no test script, so a suite that lost its script - or a
      # workspace renamed out from under it - would report green while testing nothing. A dead test
      # looks exactly like coverage. If a new workspace gains tests, add a line here and this stays
      # honest about what it actually ran.
      - name: Run client-core tests
        run: npm test --workspace @devthrottle/client-core

      - name: Run Cockpit tests
        run: npm test --workspace @devthrottle/cockpit

      # The shells must still BUILD, not just typecheck: the production build runs the real Vite
      # pipeline (bundling, the PWA service worker) and fails on things tsc never sees.
      - name: Build the mobile PWA
        run: npm run build --workspace @devthrottle/mobile

      - name: Build the Cockpit
        run: npm run build --workspace @devthrottle/cockpit

  decision:
    name: Continuous integration decision
    if: always()
    needs: [changes, build-and-test, web]
    runs-on: ubuntu-latest
    env:
      CHANGE_DECISION: ${{ needs.changes.result }}
      DOTNET_DECISION: ${{ needs.build-and-test.result }}
      WEB_DECISION: ${{ needs.web.result }}
      RUN_DOTNET: ${{ needs.changes.outputs.run_dotnet }}
      RUN_WEB: ${{ needs.changes.outputs.run_web }}
      READY_FOR_FULL_VALIDATION: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
      REASON: ${{ needs.changes.outputs.reason }}
    steps:
      - name: Require every selected build
        shell: pwsh
        run: |
          $ready = $env:READY_FOR_FULL_VALIDATION -eq "true"
          $dotNetRequired = $ready -and $env:RUN_DOTNET -eq "true"
          $webRequired = $ready -and $env:RUN_WEB -eq "true"
          $failures = [System.Collections.Generic.List[string]]::new()

          if ($env:CHANGE_DECISION -ne "success") {
            $failures.Add("Changed-path classification ended as $($env:CHANGE_DECISION).")
          }
          if ($dotNetRequired -and $env:DOTNET_DECISION -ne "success") {
            $failures.Add("The Microsoft .NET build was required but ended as $($env:DOTNET_DECISION).")
          }
          if ($webRequired -and $env:WEB_DECISION -ne "success") {
            $failures.Add("The web build was required but ended as $($env:WEB_DECISION).")
          }

          "### Final decision" >> $env:GITHUB_STEP_SUMMARY
          "Ready for full validation: $ready" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Build | Selected | Result |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Microsoft .NET | $dotNetRequired | $($env:DOTNET_DECISION) |" >> $env:GITHUB_STEP_SUMMARY
          "| Web | $webRequired | $($env:WEB_DECISION) |" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Reason: $($env:REASON)" >> $env:GITHUB_STEP_SUMMARY

          if ($failures.Count -gt 0) {
            throw ($failures -join " ")
          }
